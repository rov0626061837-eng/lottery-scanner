<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTTO NUMBER EXTRACTOR V1</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script><style>body{font-family:-apple-system,sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px}main{padding:14px;max-width:900px;margin:auto}button,label{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:16px;font-weight:700}label{background:#2563eb;color:white;text-align:center}button{background:#16a34a;color:white}button:disabled{opacity:.45}#copy{background:#7c3aed}.status,.results{background:white;border-radius:12px;padding:12px;margin-top:10px}.bar{height:9px;background:#ddd;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#16a34a}.viewer{position:relative;background:#111;overflow:auto;border-radius:12px;margin-top:10px}.viewer canvas{display:block;max-width:100%}.box{position:absolute;border:2px solid #22c55e;background:#16a34dcc;color:#fff;font-weight:800;font-size:12px;padding:2px;border-radius:4px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.item{background:#f9fafb;border:1px solid #ddd;border-radius:8px;padding:9px;font-family:monospace}input{display:none}</style></head><body><header><b>LOTTO NUMBER EXTRACTOR V1</b><br><small>หาเลข 6 หลัก → ตีกรอบ → นับ → คัดลอก</small></header><main><label for="f">📷 เลือกรูปสลาก</label><input id="f" type="file" accept="image/*" multiple><button id="go" disabled>▶ เริ่มคัดเลข</button><div class="status"><div class="bar"><i id="bar"></i></div><div id="msg">ยังไม่ได้เลือกรูป</div></div><div class="viewer" id="view"><canvas id="c"></canvas></div><div class="results"><b>พบ <span id="n">0</span> ชุด</b><button id="copy">📋 คัดลอกทั้งหมด</button><div class="list" id="list"></div></div></main><script>
const f=document.getElementById('f'),go=document.getElementById('go'),msg=document.getElementById('msg'),bar=document.getElementById('bar'),view=document.getElementById('view'),c=document.getElementById('c'),ctx=c.getContext('2d'),list=document.getElementById('list'),cnt=document.getElementById('n');let files=[],nums=[];
f.onchange=()=>{files=[...f.files];go.disabled=!files.length;msg.textContent=`เลือก ${files.length} รูป`};
function setp(x,t){bar.style.width=(x*100)+'%';msg.textContent=t}
function six(s){let x=(s||'').replace(/\D/g,'');return x.length===6?x:null}
function box(b,i,s){let d=document.createElement('div');d.className='box';d.textContent=i;d.style.left=b.x0*s+'px';d.style.top=b.y0*s+'px';d.style.width=(b.x1-b.x0)*s+'px';d.style.height=(b.y1-b.y0)*s+'px';view.appendChild(d)}
function render(){cnt.textContent=nums.length;list.innerHTML=nums.map((x,i)=>`<div class="item">${i+1}. ${x}</div>`).join('')}
go.onclick=async()=>{go.disabled=true;nums=[];render();view.querySelectorAll('.box').forEach(x=>x.remove());try{let w=await Tesseract.createWorker('eng',1,{logger:m=>m.progress&&setp(m.progress*.8,m.status||'กำลังอ่าน...')});await w.setParameters({tessedit_char_whitelist:'0123456789'});for(let z=0;z<files.length;z++){setp(z/files.length,`กำลังอ่านรูป ${z+1}/${files.length}`);let u=URL.createObjectURL(files[z]),im=new Image();im.src=u;await im.decode();let s=Math.min(1,1200/im.naturalWidth);c.width=im.naturalWidth*s;c.height=im.naturalHeight*s;ctx.drawImage(im,0,0,c.width,c.height);let r=await w.recognize(im),hits=[];(r.data.words||[]).forEach(q=>{let x=six(q.text);if(x&&q.bbox)hits.push({x,b:q.bbox})});hits.sort((a,b)=>a.b.y0-b.b.y0||a.b.x0-b.b.x0);let kept=[];for(let h of hits){let d=kept.some(k=>{let ix=Math.max(0,Math.min(h.b.x1,k.b.x1)-Math.max(h.b.x0,k.b.x0)),iy=Math.max(0,Math.min(h.b.y1,k.b.y1)-Math.max(h.b.y0,k.b.y0));return ix*iy>.5*Math.min((h.b.x1-h.b.x0)*(h.b.y1-h.b.y0),(k.b.x1-k.b.x0)*(k.b.y1-k.b.y0))});if(!d)kept.push(h)}for(let h of kept){nums.push(h.x);box(h.b,nums.length,s)}render();URL.revokeObjectURL(u);setp((z+1)/files.length,`เสร็จรูป ${z+1} — รวม ${nums.length} ชุด`)}await w.terminate();setp(1,`เสร็จแล้ว — ${nums.length} ชุด`)}catch(e){msg.textContent='เกิดข้อผิดพลาด: '+e.message}go.disabled=false};
document.getElementById('copy').onclick=async()=>{if(nums.length){await navigator.clipboard.writeText(nums.join('\n'));msg.textContent=`คัดลอกแล้ว ${nums.length} ชุด`}};
</script></body></html>
