<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOTTO CLOUD OCR 6 DIGIT – FIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #0001}
h1{font-size:25px;margin:2px 0 5px}.sub{color:#666;font-size:14px;margin-bottom:12px}
label{display:block;font-weight:800;margin:12px 0 6px}input[type=password],select{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px}
input[type=file]{width:100%;padding:10px 0;font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
button{border:0;border-radius:13px;padding:14px 15px;font-size:16px;font-weight:800;flex:1;min-width:140px}.blue{background:#1769e0;color:#fff}.green{background:#16834b;color:#fff}.gray{background:#e5e7eb}.orange{background:#f59e0b;color:#111}
button:disabled{opacity:.5}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:7px}.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid #ddd;flex:none}
.status{background:#f7f8fa;border-radius:16px;padding:14px;margin-top:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.state{font-weight:900;font-size:18px}.pct{font-size:32px;font-weight:950}.progress{height:20px;background:#e1e4e8;border-radius:99px;overflow:hidden;margin:8px 0}.bar{height:100%;width:0;background:#1769e0;transition:width .2s}.bar.busy{background:linear-gradient(90deg,#1769e0,#82b2ff,#1769e0);background-size:200% 100%;animation:move 1s linear infinite}@keyframes move{from{background-position:200%}to{background-position:-200%}}
.detail{font-size:13px;color:#555}.count{font-size:22px;font-weight:950}.warn{color:#a15c00;font-size:13px;margin-top:5px}.nums{font-family:ui-monospace,monospace;font-size:18px;line-height:1.8;white-space:pre-wrap;word-break:break-word;margin-top:8px}
textarea{width:100%;min-height:190px;border:1px solid #ccc;border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:14px}.log{background:#111;color:#d7f9d7;border-radius:12px;padding:12px;min-height:80px;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
.small{font-size:12px;color:#666}.ok{color:#087a3e}.err{color:#b42318}.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<h1>LOTTO CLOUD OCR</h1>
<div class="sub">เวอร์ชันแก้ไข: แสดงสถานะจริง + แจ้ง Error + ลดขนาดรูปอัตโนมัติ</div>

<div class="card">
<label>1) API Key จาก OCR.space</label>
<input id="key" type="password" placeholder="วาง API Key ตรงนี้">
<div class="small">ระบบเก็บ Key ไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</div>

<label>2) เลือกรูปสลาก</label>
<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<div id="thumbs" class="thumbs"></div>

<label>3) OCR Engine</label>
<select id="engine"><option value="2" selected>Engine 2 – สมดุลความเร็ว/คุณภาพ</option><option value="3">Engine 3 – เน้นคุณภาพ</option></select>

<div class="row">
<button id="test" class="orange">🧪 ทดสอบ API</button>
<button id="scan" class="blue">🔍 สแกนทั้งหมด</button>
</div>
<div class="row">
<button id="copy" class="green">📋 คัดลอกทั้งหมด</button>
<button id="clear" class="gray">🗑 ล้าง</button>
</div>

<div class="status">
 <div class="top"><div id="state" class="state">พร้อม</div><div id="pct" class="pct">0%</div></div>
 <div class="progress"><div id="bar" class="bar"></div></div>
 <div id="detail" class="detail">ยังไม่ได้เริ่มสแกน</div>
</div>
</div>

<div class="card">
<div class="count">พบเลข 6 หลัก: <span id="count">0</span></div>
<div class="warn">เก็บเฉพาะเลข 6 หลักที่ OCR อ่านติดกัน และไม่ลบเลขซ้ำจากคนละใบ</div>
<div id="nums" class="nums"></div>
</div>

<div class="card">
<label>บันทึกการทำงาน / Error</label>
<div id="log" class="log">รอการทำงาน...</div>
</div>

<div class="card">
<label>ข้อความ OCR ดิบ</label>
<textarea id="raw" placeholder="ผล OCR จะปรากฏตรงนี้"></textarea>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const key=$('key'), files=$('files'), engine=$('engine'), thumbs=$('thumbs');
let nums=[];

key.value=localStorage.getItem('lotto_ocr_key')||'';
key.oninput=()=>localStorage.setItem('lotto_ocr_key',key.value.trim());

function log(s){$('log').textContent += '\\n'+s; $('log').scrollTop=$('log').scrollHeight}
function setProgress(p,state,detail,busy=false){
 p=Math.max(0,Math.min(100,p)); $('pct').textContent=Math.round(p)+'%'; $('bar').style.width=p+'%';
 $('bar').classList.toggle('busy',busy); $('state').innerHTML=busy?'<span class="spin">⟳</span> '+state:state;
 $('detail').textContent=detail||'';
}
function render(){ $('count').textContent=nums.length; $('nums').textContent=nums.join('\\n') }
function extract(text){return [...text.matchAll(/(?<!\\d)\\d{6}(?!\\d)/g)].map(x=>x[0])}

files.onchange=()=>{
 thumbs.innerHTML='';
 [...files.files].forEach(f=>{let i=document.createElement('img');i.className='thumb';i.src=URL.createObjectURL(f);thumbs.appendChild(i)});
 log('เลือกรูป: '+files.files.length+' รูป');
};

function compressImage(file,maxSide=2200,quality=.88){
 return new Promise((resolve,reject)=>{
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
   URL.revokeObjectURL(url);
   let w=img.naturalWidth,h=img.naturalHeight;
   const scale=Math.min(1,maxSide/Math.max(w,h)); w=Math.round(w*scale);h=Math.round(h*scale);
   const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   c.toBlob(b=>b?resolve(b):reject(new Error('สร้างรูปสำหรับ OCR ไม่สำเร็จ')),'image/jpeg',quality);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('เปิดรูปไม่สำเร็จ'))};
  img.src=url;
 });
}

async function callOCR(blob,name,keyValue,eng){
 const fd=new FormData();
 fd.append('file',blob,name.replace(/\.[^.]+$/i,'.jpg'));
 fd.append('language','eng');
 fd.append('OCREngine',eng);
 fd.append('isOverlayRequired','false');
 fd.append('scale','true');
 const r=await fetch('https://api.ocr.space/parse/image',{
   method:'POST',
   headers:{'apikey':keyValue},
   body:fd
 });
 const text=await r.text();
 let j; try{j=JSON.parse(text)}catch{throw new Error('API ตอบกลับไม่ใช่ JSON (HTTP '+r.status+')')};
 if(!r.ok) throw new Error('HTTP '+r.status+' — '+(j.ErrorMessage||text.slice(0,250)));
 if(j.IsErroredOnProcessing) throw new Error(Array.isArray(j.ErrorMessage)?j.ErrorMessage.join(' '):(j.ErrorMessage||j.ErrorDetails||'OCR processing error'));
 return (j.ParsedResults||[]).map(x=>x.ParsedText||'').join('\\n');
}

$('test').onclick=async()=>{
 const k=key.value.trim();
 if(!k){alert('ใส่ API Key ก่อน');return}
 localStorage.setItem('lotto_ocr_key',k); $('log').textContent='';
 setProgress(5,'กำลังทดสอบ API','กำลังสร้างภาพทดสอบ...',true);
 try{
   const c=document.createElement('canvas');c.width=900;c.height=300;const x=c.getContext('2d');
   x.fillStyle='#fff';x.fillRect(0,0,900,300);x.fillStyle='#000';x.font='bold 110px Arial';x.fillText('123456',180,190);
   const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
   setProgress(35,'กำลังส่งคำขอ','ส่งภาพทดสอบไป OCR.space...',true);
   const t=await callOCR(b,'api-test.jpg',k,engine.value);
   log('API ตอบกลับสำเร็จ');
   log('ข้อความที่ OCR อ่าน: '+(t||'(ว่าง)'));
   setProgress(100,'✅ API ใช้งานได้','การเชื่อมต่อ OCR.space สำเร็จ');
 }catch(e){
   log('ERROR: '+e.message); setProgress(0,'❌ API ใช้งานไม่ได้',e.message,false);
   alert('ทดสอบ API ไม่ผ่าน\\n\\n'+e.message);
 }
};

$('scan').onclick=async()=>{
 const k=key.value.trim(), fs=[...files.files];
 if(!k){alert('กรุณาใส่ API Key ก่อน');return}
 if(!fs.length){alert('กรุณาเลือกรูปสลากก่อน');return}
 localStorage.setItem('lotto_ocr_key',k); $('log').textContent='';
 nums=[];$('raw').value='';render(); $('scan').disabled=true;$('test').disabled=true;
 let raw='';
 try{
  log('เริ่มสแกน '+fs.length+' รูป');
  for(let i=0;i<fs.length;i++){
   const f=fs[i];
   setProgress(Math.round(i/fs.length*100),`กำลังเตรียมรูป ${i+1}/${fs.length}`,f.name,true);
   log('รูป '+(i+1)+': '+f.name+' ('+Math.round(f.size/1024)+' KB)');
   const blob=await compressImage(f);
   log('แปลงรูปสำหรับ OCR: '+Math.round(blob.size/1024)+' KB');
   setProgress(Math.round((i+.25)/fs.length*100),`กำลังส่งรูป ${i+1}/${fs.length}`,'กำลังอัปโหลดไป OCR.space...',true);
   const t=await callOCR(blob,f.name,k,engine.value);
   raw+='===== '+f.name+' =====\\n'+t+'\\n\\n'; $('raw').value=raw;
   const found=extract(t); nums.push(...found); render();
   log('รูป '+(i+1)+' เสร็จ: พบ '+found.length+' เลข');
   setProgress(Math.round((i+1)/fs.length*100),`อ่านเสร็จ ${i+1}/${fs.length}`,`พบเลขสะสม ${nums.length} เลข`,i+1<fs.length);
  }
  setProgress(100,'✅ เสร็จแล้ว',`พบเลข 6 หลักทั้งหมด ${nums.length} เลข`);
 }catch(e){
  log('ERROR: '+e.message);
  setProgress(Math.round((fs.length?0:0)),'❌ หยุดเพราะ Error',e.message,false);
  alert('สแกนไม่สำเร็จ\\n\\n'+e.message+'\\n\\nดูรายละเอียดได้ในช่อง “บันทึกการทำงาน / Error”');
 }finally{$('scan').disabled=false;$('test').disabled=false}
};

$('copy').onclick=async()=>{
 if(!nums.length){alert('ยังไม่มีเลขให้คัดลอก');return}
 try{await navigator.clipboard.writeText(nums.join('\\n'));setProgress(100,'📋 คัดลอกแล้ว','คัดลอก '+nums.length+' เลขเรียบร้อย')}
 catch{alert('คัดลอกอัตโนมัติไม่ได้ ให้กดค้างที่รายการเลขแล้วเลือกคัดลอก')}
};
$('clear').onclick=()=>{nums=[];files.value='';thumbs.innerHTML='';$('raw').value='';$('log').textContent='รอการทำงาน...';render();setProgress(0,'พร้อม','ยังไม่ได้เริ่มสแกน')};
render();
</script>
</body>
</html>
